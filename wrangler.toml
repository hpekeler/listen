# Konfiguration fuer `npx wrangler deploy`.
#
# Ohne diese Datei raet wrangler aus dem Ordner und liegt zweimal daneben:
# Es nimmt den Ordnernamen als Worker-Namen ("listen" statt "listen-sync") und
# haelt das Projekt wegen der index.html fuer eine statische Website. Dann
# wuerde der Ordnerinhalt hochgeladen statt worker.js deployt.
#
# `main` allein raeumt beides aus: Damit ist klar, dass hier ein Worker-Skript
# deployt wird und sonst nichts. Die App selbst liegt auf GitHub Pages und hat
# mit diesem Deploy nichts zu tun.

name = "listen-sync"          # muss zu PROXY_BASE in index.html passen
main = "worker.js"
compatibility_date = "2024-11-01"

# Haelt die Adresse listen-sync.<konto>.workers.dev am Leben.
workers_dev = true

# Hier stehen bewusst KEINE [vars]. Alles Konfigurierbare liegt als Secret:
#
#   npx wrangler secret put EXTRA_WEBDAV_HOSTS   # erlaubte WebDAV-Server
#   npx wrangler secret put VAPID_PRIVATE_JWK    # Push, bleibt geheim
#   npx wrangler secret put VAPID_PUBLIC
#   npx wrangler secret put VAPID_SUBJECT        # mailto:...
#
# Gruende, auch fuer die an sich harmlosen Hostnamen:
#  - Diese Datei liegt oeffentlich auf GitHub. Die Adresse einer privaten
#    Nextcloud gehoert der Person, der sie gehoert, nicht ins Repo.
#  - Secrets ueberleben jeden Deploy. Als [vars] wuerde jeder `wrangler deploy`
#    den in der Konsole gesetzten Wert ueberschreiben - freigeschaltete Server
#    waeren stillschweigend wieder weg.
#  - Der Code liest env.EXTRA_WEBDAV_HOSTS; ob Var oder Secret, ist ihm egal.
#
# Ein Name darf nicht gleichzeitig hier und als Secret existieren - deshalb
# bitte keine [vars]-Sektion mit diesen Namen nachtragen.
# Neuen Server freischalten: siehe CLOUDFLARE.md, Abschnitt 3.
