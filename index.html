<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Listen</title>
<meta name="theme-color" content="#1F302A">
<link rel="manifest" href="./manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Listen">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<style>
  :root{
    --paper:#EEF1EA; --card:#FFFFFF; --card-2:#F7F8F3;
    --ink:#20302A; --ink-soft:#5C6B62; --line:#DCE1D6;
    --amber:#C8881F; --amber-soft:#F4E6C6; --amber-line:#E7C879;
    --brick:#A8503A; --green:#3C7A52;
    --shadow:0 1px 2px rgba(31,48,42,.06), 0 6px 18px rgba(31,48,42,.06);
    --serif:"Iowan Old Style",Georgia,"Palatino Linotype",serif;
    --sans:-apple-system,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --r:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.4;
    padding-bottom:env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased}
  #app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

  header{position:sticky;top:0;z-index:5;background:var(--paper);padding:18px 16px 10px;
    border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  header.hidden{display:none}
  .wordmark{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:.2px;flex:1}
  .wordmark small{font-family:var(--mono);font-size:11px;color:var(--ink-soft);letter-spacing:0;display:block;font-weight:400;margin-top:1px}
  .syncpill{font-family:var(--mono);font-size:11px;color:var(--ink-soft);border:1px solid var(--line);
    border-radius:999px;padding:5px 9px;background:var(--card);display:flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
  .syncpill.busy .dot{background:var(--amber);animation:pulse 1s infinite}
  .syncpill.off .dot{background:#c9ccc5}
  .syncpill.err .dot{background:var(--brick)}
  @keyframes pulse{50%{opacity:.3}}
  .gear{background:none;border:none;color:var(--ink-soft);cursor:pointer;padding:6px;border-radius:8px;display:inline-flex}
  .gear:hover{background:var(--card-2);color:var(--ink)} .gear svg{width:19px;height:19px}

  main{flex:1;padding:8px 14px 96px}
  .crumb{display:flex;align-items:center;gap:8px;margin:6px 2px 14px;color:var(--ink-soft);font-size:14px}
  .back{background:none;border:none;color:var(--ink);font:inherit;cursor:pointer;display:flex;align-items:center;gap:6px;padding:6px 2px}
  .back svg{width:16px;height:16px}

  .group{margin-bottom:22px}
  .group-head{display:flex;align-items:center;gap:8px;margin:0 2px 9px}
  .group-title{font-family:var(--serif);font-size:18px;font-weight:600;position:relative;padding-bottom:3px}
  .group-title::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--amber-line);border-radius:2px}
  .group-count{font-family:var(--mono);font-size:12px;color:var(--ink-soft)}
  .group-head .spacer{flex:1}
  .section-label{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin:0 2px 9px}
  .iconbtn{background:none;border:none;color:var(--ink-soft);cursor:pointer;padding:6px;border-radius:8px;display:inline-flex}
  .iconbtn:hover{background:var(--card-2);color:var(--ink)} .iconbtn svg{width:18px;height:18px}
  .iconbtn:disabled{opacity:.3;cursor:default} .iconbtn:disabled:hover{background:none;color:var(--ink-soft)}

  .lists{display:flex;flex-direction:column;gap:8px}
  .listcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
    padding:13px 14px;cursor:pointer;display:flex;align-items:center;gap:12px;text-align:left;width:100%;font:inherit;color:inherit;transition:transform .08s ease}
  .listcard:active{transform:scale(.992)}
  .listcard .name{font-size:16px;font-weight:600;flex:1}
  /* Langdruck öffnet das Löschen-Menü – ohne das hier markiert iOS stattdessen Text. */
  .lists[data-group] .listcard{-webkit-user-select:none;user-select:none;padding-left:4px}
  .lists[data-group] .listcard .handle{margin-top:0}
  .listcard.dragging{opacity:.75;border-color:var(--amber-line);box-shadow:0 8px 22px rgba(31,48,42,.18);transform:scale(1.01)}
  /* Beim Ziehen bleibt auch eine leere Gruppe ein sichtbares Ziel. */
  body.dragging .lists[data-group]{min-height:46px;border:1px dashed var(--line);border-radius:var(--r);margin:-4px;padding:4px}
  body.dragging .lists[data-group]:empty::after{content:"hierher ziehen";display:block;color:var(--ink-soft);font-size:13px;padding:11px 10px}
  /* width:100% aus .ghost würde hier zweimal die volle Breite fordern. */
  .grouptools{display:flex;gap:8px;margin-top:8px}
  .grouptools .ghost{width:auto;min-width:0;flex:1}
  .grouptools .ghost.narrow{flex:none;white-space:nowrap}
  .listcard .tally{font-family:var(--mono);font-size:12.5px;color:var(--ink-soft);white-space:nowrap}
  .listcard .tally b{color:var(--amber);font-weight:600}
  .listcard.empty .tally{color:#aab0a6}
  .listcard.tpl{border-style:dashed;background:var(--card-2)}

  .ghost{background:var(--card-2);border:1px dashed var(--line);border-radius:var(--r);padding:11px 13px;
    color:var(--ink-soft);cursor:pointer;font:inherit;width:100%;text-align:left;display:flex;align-items:center;gap:8px}
  .ghost:hover{border-color:var(--amber-line);color:var(--ink)} .ghost svg{width:16px;height:16px}
  .newgroup{margin-top:6px}

  .inlineform{display:flex;gap:8px;align-items:center;width:100%}
  input.field{flex:1;font:inherit;padding:10px 12px;border:1px solid var(--amber-line);border-radius:10px;
    background:var(--card);color:var(--ink);outline:none;width:100%}
  input.field:focus{box-shadow:0 0 0 3px var(--amber-soft)}
  .btn{font:inherit;border:none;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:600;background:var(--ink);color:#fff}
  .btn.amber{background:var(--amber)} .btn.full{width:100%;justify-content:center;display:flex}
  .btn.subtle{background:var(--card-2);color:var(--ink);border:1px solid var(--line);font-weight:500}
  .btn.danger{background:none;color:var(--brick);border:1px solid var(--line)}
  .btn:disabled{opacity:.5}

  .listtitle{font-family:var(--serif);font-size:26px;font-weight:600;margin:2px 2px 4px;line-height:1.15}
  .listmeta{font-family:var(--mono);font-size:12px;color:var(--ink-soft);margin:0 2px 14px}

  .additem{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);
    border-radius:var(--r);padding:6px 8px 6px 14px;box-shadow:var(--shadow);margin-bottom:14px}
  .additem .row{display:flex;gap:8px;align-items:center}
  .additem input{flex:1;border:none;outline:none;font:inherit;background:none;color:var(--ink);padding:8px 0;min-width:0}
  .additem .plus{background:var(--amber);color:#fff;border:none;width:38px;height:38px;border-radius:10px;font-size:22px;cursor:pointer;display:grid;place-items:center;flex:none}
  .additem .notebtn{background:none;border:none;color:#b5bbb0;cursor:pointer;padding:8px;border-radius:9px;flex:none;display:inline-flex}
  .additem .notebtn svg{width:19px;height:19px}
  .additem .notebtn.on{background:var(--amber-soft);color:var(--amber)}
  /* Unter 16px zoomt iOS beim Hineintippen in das Feld hinein. Nie kleiner. */
  .additem .note{border-top:1px solid var(--line);border-radius:0;padding:9px 0;font-size:16px;margin-right:8px}

  ul.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  ul.items:empty{display:none}
  li.item{background:var(--card);display:flex;align-items:flex-start;gap:10px;padding:12px 12px 12px 13px}
  li.item.dragging{opacity:.6;background:var(--amber-soft)}
  li.item .check{width:21px;height:21px;border:2px solid var(--ink-soft);border-radius:6px;flex:none;margin-top:1px;cursor:pointer;display:grid;place-items:center;background:none;color:#fff;padding:0}
  li.item.done .check{background:var(--green);border-color:var(--green)}
  li.item .check svg{width:13px;height:13px;opacity:0;transition:opacity .12s}
  li.item.done .check svg{opacity:1}
  li.item .body{flex:1;min-width:0;cursor:pointer}
  li.item .text{display:inline}
  li.item.done .text{color:var(--ink-soft);text-decoration:line-through;
    text-decoration-color:var(--ink-soft);text-decoration-thickness:2px;text-decoration-skip-ink:none}
  li.item .qty{font-family:var(--mono);font-size:12px;color:var(--amber);font-weight:600;margin-right:7px}
  li.item .sub{display:block;margin-top:3px;font-size:13px;color:var(--ink-soft);word-break:break-word}
  li.item .sub a{color:var(--green)}
  .handle{background:none;border:none;color:#c2c8bd;cursor:grab;padding:8px 6px;flex:none;touch-action:none;margin-top:1px}
  .handle:active{cursor:grabbing} .handle svg{width:18px;height:18px}
  /* Erledigte sitzen per Sortierung unten – Ziehen könnte nur zurückspringen. */
  li.item.done .handle{visibility:hidden}
  li.item .more{background:none;border:none;color:#b5bbb0;cursor:pointer;padding:4px;border-radius:7px;flex:none}
  li.item .more:hover{background:var(--card-2);color:var(--ink)} li.item .more svg{width:18px;height:18px}

  .by{font-family:var(--mono);font-size:11px;color:var(--ink-soft);text-align:center}

  .sheet{position:fixed;inset:0;background:rgba(20,28,24,.34);z-index:20;display:flex;align-items:flex-end;justify-content:center}
  .sheet-inner{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:8px 8px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.18)}
  .sheet h3{font-family:var(--serif);font-size:16px;margin:10px 12px 4px;font-weight:600}
  .sheet button.row{width:100%;text-align:left;background:none;border:none;font:inherit;color:var(--ink);padding:14px 14px;border-radius:12px;cursor:pointer;display:flex;align-items:center;gap:12px}
  .sheet button.row:hover{background:var(--card-2)}
  .sheet button.row.danger{color:var(--brick)}
  .sheet button.row svg{width:19px;height:19px;flex:none;color:var(--ink-soft)}
  .sheet button.row.danger svg{color:var(--brick)}
  /* Sheets, in denen getippt wird: gleiche Hülle, aber Formular statt Menüzeilen. */
  .sheet form.pad{padding:4px 12px 6px;display:flex;flex-direction:column;gap:10px}
  .sheet .head{display:flex;align-items:center;gap:8px;margin:10px 12px 2px}
  .sheet .head h3{margin:0;flex:1}
  .sheet .head .x{background:none;border:none;color:var(--ink-soft);cursor:pointer;padding:6px;border-radius:8px;display:inline-flex}
  .sheet .head .x:hover{background:var(--card-2);color:var(--ink)} .sheet .head .x svg{width:18px;height:18px}
  .sheet .hint{font-size:12px;color:var(--ink-soft);margin:-2px 2px 0}
  textarea.field{font:inherit;font-family:var(--sans);padding:10px 12px;border:1px solid var(--amber-line);border-radius:10px;
    background:var(--card);color:var(--ink);outline:none;width:100%;min-height:150px;resize:vertical;line-height:1.45}
  textarea.field:focus{box-shadow:0 0 0 3px var(--amber-soft)}
  .field.big{font-size:17px;padding:13px 13px}
  .linkbtn{background:none;border:none;font:inherit;color:var(--brick);cursor:pointer;padding:10px;border-radius:8px;align-self:center}
  .linkbtn:hover{background:var(--card-2)}

  /* Sperrt die Oberfläche, solange etwas läuft, das nicht halb passieren darf
     (Abmelden, Neuladen von GMX). Liegt über allen Sheets. */
  .busy{position:fixed;inset:0;background:rgba(20,28,24,.44);z-index:60;display:grid;place-items:center;padding:24px}
  .busy .card{background:var(--card);border-radius:14px;padding:16px 20px;box-shadow:var(--shadow);
    font-weight:600;display:flex;align-items:center;gap:11px;max-width:100%}
  .busy .spin{width:16px;height:16px;flex:none;border:2px solid var(--amber-line);border-top-color:var(--amber);
    border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .empty-state{text-align:center;color:var(--ink-soft);padding:48px 24px}
  .empty-state .big{font-family:var(--serif);font-size:20px;color:var(--ink);margin-bottom:6px}
  .archived-tag,.tpl-tag{font-family:var(--mono);font-size:11px;color:var(--amber);border:1px solid var(--amber-line);border-radius:999px;padding:2px 8px}

  .setup{padding:30px 22px 40px;max-width:460px;margin:0 auto}
  .setup .logo{font-family:var(--serif);font-size:30px;font-weight:600;margin-bottom:2px}
  .setup .lede{color:var(--ink-soft);margin-bottom:24px}
  .setup label{display:block;font-size:13px;font-weight:600;margin:14px 2px 5px}
  .setup .hint{font-size:12px;color:var(--ink-soft);margin:5px 2px 0}
  .setup .hint a{color:var(--green)}
  .setup .grp{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:4px 14px 16px;box-shadow:var(--shadow)}
  .setup .err{color:var(--brick);font-size:13px;margin-top:12px;min-height:1.2em}
  .setup .skip{display:block;width:100%;text-align:center;background:none;border:none;color:var(--ink-soft);font:inherit;padding:14px;margin-top:14px;cursor:pointer;text-decoration:underline}
  /* Der Absender sieht seine eigene Push-Meldung nie – ohne Rückmeldung wirkt
     der Knopf kaputt. Deshalb dieser kurze Einblender. */
  .toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;
    background:var(--ink);color:#fff;font-size:14px;line-height:1.3;padding:11px 17px;border-radius:999px;
    box-shadow:0 6px 24px rgba(31,48,42,.28);max-width:calc(100% - 32px);text-align:center;animation:toastin .18s ease}
  .toast.err{background:var(--brick)}
  @keyframes toastin{from{opacity:0;transform:translate(-50%,8px)}}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header id="hdr">
    <div class="wordmark">Listen<small id="here">geteilte Listen</small></div>
    <button class="syncpill" id="syncpill" title="Jetzt synchronisieren"><span class="dot"></span><span id="synctext">aktuell</span></button>
    <button class="gear" id="gear" title="Einstellungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-2.81 1.17V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 7 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 2.6 15H2.5a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6h.09A1.65 1.65 0 0 0 11 2.5V2.5a2 2 0 0 1 4 0v.09A1.65 1.65 0 0 0 19.4 9c.36 0 .7.12.97.34"/></svg></button>
  </header>
  <main id="main"></main>
</div>

<script>
/* ============================================================================
   LISTEN – geteilte Einkaufs-/To-do-Listen, Sync über GMX
   ----------------------------------------------------------------------------
   • Listen-Daten liegen in EINER JSON-Datei in deiner GMX-Cloud.
   • Zugriff läuft über deinen Cloudflare-Worker (umgeht den Browser-CORS-Block).
   • GMX-Login wird NUR auf dem Gerät gespeichert (localStorage), NIE im Code.

   >>> EINZIGE STELLEN, DIE DU VOR DEM DEPLOY ANPASST: <<<
   1. Worker-URL eintragen (bekommst du nach Schritt 2 des Plans).
   2. VAPID_PUBLIC eintragen – der öffentliche Push-Schlüssel. Erzeugen mit
      `node tools/gen-vapid.mjs`, den privaten Teil als Worker-Secret ablegen.
      Bleibt der Platzhalter stehen, versteckt die App den Anstupsen-Knopf. */
const PROXY_BASE  = 'https://listen-sync.henri-pekeler.workers.dev';
const VAPID_PUBLIC = 'BMxJRa4dADQ-E0bwb6MSjpTQ8dLMqQnaZLAwJCIiZpNUE0IuCluX3xVGdcA_3jwPvwISyVxU-bSQ8xqw4H5IqiI';
/* ========================================================================== */

const GMX_BASE   = 'https://webdav.mc.gmx.net';   // nur Doku – der Worker kennt das Ziel
const SHARED_KEY = 'listen_v1';
const LOCAL_KEY  = 'listen_v1_local';
const CFG_KEY    = 'listen_cfg';
const DEV_KEY    = 'listen_device_id';            // lokal, nie synchronisiert
const SYNC_MS    = 15000;
const TOMB_MAXAGE= 30*24*60*60*1000;

/* ---- Persistenz: echtes localStorage, mit Fallback (z. B. Vorschau-Sandbox) */
let _mem={};
const HAS_LS=(()=>{ try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); return true; }catch(e){ return false; } })();
async function lget(key){ if(HAS_LS){ try{ const v=localStorage.getItem(key); return v?JSON.parse(v):null; }catch(e){} } return _mem[key]||null; }
async function lset(key,val){ if(HAS_LS){ try{ localStorage.setItem(key,JSON.stringify(val)); return; }catch(e){} } _mem[key]=val; }
/* Beide Ablagen räumen: Beim Abmelden darf nichts zurückbleiben, egal welche
   von beiden gerade greift. */
async function lremove(key){ if(HAS_LS){ try{ localStorage.removeItem(key); }catch(e){} } delete _mem[key]; }

/* ---- CONFIG (lokal, nie synchronisiert, nie im Code) ---------------------- */
let config={ configured:false, mode:'demo', gmxUser:'', gmxPass:'', path:'/listen.json', person:'' };

/* ---- HTTP über den Worker-Proxy ------------------------------------------- */
async function gmxHttp(method, body, opt={}){
  if(!PROXY_BASE || PROXY_BASE.includes('DEIN-WORKER')) throw new Error('Worker-URL (PROXY_BASE) noch nicht eingetragen');
  const p=config.path.startsWith('/')?config.path:'/'+config.path;
  let url=PROXY_BASE.replace(/\/$/,'')+'?path='+encodeURIComponent(p);
  if(method==='GET') url+='&_='+Date.now();   // Cache-Buster gegen veraltete Lesezugriffe
  const auth='Basic '+btoa(unescape(encodeURIComponent(config.gmxUser+':'+config.gmxPass)));
  const init={method,cache:'no-store',headers:{Authorization:auth,'Content-Type':'application/json'},body};
  let res;
  if(opt.keepalive){
    // keepalive hält den PUT beim Schließen der App am Leben – aber nur bis 64 KB Body.
    try{ res=await fetch(url,{...init,keepalive:true}); }
    catch(e){ res=await fetch(url,init); }
  } else res=await fetch(url,init);
  const txt=await res.text().catch(()=> '');
  return {status:res.status,data:txt};
}

/* ---- Remote (austauschbar) ------------------------------------------------ */
const Remote={
  async read(){
    if(config.mode!=='gmx') return await lget(SHARED_KEY);   // Demo: nur dieses Gerät
    const res=await gmxHttp('GET');
    if(res.status===404) return null;
    if(res.status<200||res.status>=300){ const x=(res.status>=500&&res.data)?(' · '+String(res.data).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().slice(0,140)):''; throw new Error('GMX GET '+res.status+x); }
    return res.data?JSON.parse(res.data):null;
  },
  async write(s,opt={}){
    if(config.mode!=='gmx') return await lset(SHARED_KEY,s);
    const res=await gmxHttp('PUT',JSON.stringify(s),opt);
    if(res.status<200||res.status>=300){ const x=(res.status>=500&&res.data)?(' · '+String(res.data).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().slice(0,140)):''; throw new Error('GMX PUT '+res.status+x); }
  }
};

/* ---- Hilfen --------------------------------------------------------------- */
const now=()=>Date.now();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const linkify=s=>esc(s).replace(/(https?:\/\/[^\s]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
function parseQty(q){ const m=String(q||'').trim().match(/^(\d+(?:[.,]\d+)?)\s*([a-zäöü%]*)$/i);
  return m?{n:parseFloat(m[1].replace(',','.')),u:(m[2]||'x').toLowerCase()}:null; }
function combineQty(a,b){ const pa=parseQty(a)||{n:1,u:'x'}, pb=parseQty(b)||{n:1,u:'x'};
  if(pa.u===pb.u){ const n=pa.n+pb.n; return (Number.isInteger(n)?n:n.toFixed(2))+(pa.u==='x'?'x':pa.u); }
  return (a||'1x')+' + '+(b||'1x'); }
/* „2x Milch" -> {qty:'2x',text:'Milch'}. Eine Stelle für alle drei Wege, auf denen
   Text hereinkommt: tippen, einfügen/importieren und nachträglich bearbeiten. */
function parseLine(line){ const s=String(line||'').trim();
  const m=s.match(/^(\d+\s*(?:x|stk|kg|g|l|ml|pck)?)\s+(.*)$/i);
  return m?{qty:m[1].replace(/\s+/g,''),text:m[2].trim()}:{qty:'',text:s}; }

/* ---- Datenmodell + Merge -------------------------------------------------- */
/* `devices` hält die Push-Abos beider Handys. Sie liegen bewusst in derselben
   Datei wie die Listen: So repliziert sie der vorhandene Merge, und der Worker
   bleibt zustandslos. Ältere Stände ohne das Feld werden hier ergänzt. */
const emptyState=()=>({groups:{},lists:{},devices:{}});
const normState=s=>{ const e=emptyState(); return s?{...e,...s}:e; };
let state=emptyState();
/* Gleichstand -> lokal gewinnt: mergeState(state,remote) übergibt lokal als `l`,
   und lokal trägt die noch nicht gepushte Absicht des Nutzers. */
function mergeMap(a={},b={},mergeOne){ const out={},ids=new Set([...Object.keys(a),...Object.keys(b)]);
  for(const id of ids){ const l=a[id],r=b[id];
    out[id]= l&&r ? (mergeOne?mergeOne(l,r):((r.updatedAt||0)>(l.updatedAt||0)?r:l)) : (l||r); } return out; }
const mergeList=(l,r)=>{ const base={...((r.updatedAt||0)>(l.updatedAt||0)?r:l)}; base.items=mergeMap(l.items||{},r.items||{}); return base; };
const mergeState=(a,b)=> !a?normState(b) : !b?normState(a) : ({groups:mergeMap(a.groups,b.groups),
  lists:mergeMap(a.lists,b.lists,mergeList), devices:mergeMap(a.devices,b.devices)});
function gc(){ const cut=now()-TOMB_MAXAGE;
  for(const id of Object.keys(state.groups)) if(state.groups[id].deleted&&state.groups[id].updatedAt<cut) delete state.groups[id];
  for(const id of Object.keys(state.devices||{})) if(state.devices[id].deleted&&state.devices[id].updatedAt<cut) delete state.devices[id];
  for(const id of Object.keys(state.lists)){ const L=state.lists[id];
    if(L.deleted&&L.updatedAt<cut){ delete state.lists[id]; continue; }
    for(const iid of Object.keys(L.items||{})) if(L.items[iid].deleted&&L.items[iid].updatedAt<cut) delete L.items[iid]; } }

/* ---- Sync ----------------------------------------------------------------- */
let syncing=false;
let needPush=false;    // ein Push wurde verworfen oder schlug fehl -> nachholen
let lastReadOk=false;  // letzter Remote-Lesezugriff erfolgreich (404 zählt als ok)
/* Nach dem Abmelden darf nichts mehr zurückgeschrieben werden – auch nicht von
   einem Sync, der noch aus der Zeit davor unterwegs ist. */
const persistLocal=()=>config.configured?lset(LOCAL_KEY,state):Promise.resolve();
async function doSync(push=true,opt={}){
  if(!config.configured) return;
  if(syncing){ if(push) needPush=true; return; }
  syncing=true; setSync('busy');
  let ok=false, readOk=false;
  try{
    const remote=await Remote.read(); readOk=lastReadOk=true;
    if(!config.configured) return;   // währenddessen abgemeldet: Stand verwerfen
    state=mergeState(state,remote); gc();
    // needPush erst unmittelbar vor dem Schreiben löschen, damit eine Änderung,
    // die währenddessen reinkommt, den Merker gesetzt lässt. Und nur ein echter
    // Push darf ihn löschen – ein reiner Pull nie.
    if(push){ needPush=false; await Remote.write(state,opt); }
    await persistLocal(); setSync('ok'); ok=true;
    const a=document.activeElement;
    if(view.name!=='setup' && !(a&&/^(INPUT|TEXTAREA)$/.test(a.tagName))) render();
  }catch(e){ console.warn('Sync:',e); if(!readOk) lastReadOk=false; if(push) needPush=true;
    setSync(config.mode==='gmx'?'err':(HAS_LS?'ok':'off')); }
  finally{ syncing=false; }
  // Nur der Fall "Push kam rein, während dieser Lauf schon lief" wird sofort
  // nachgeholt. Echte Fehler nicht — sonst dreht das offline im 800ms-Takt.
  // Die fängt der 15s-Intervall unten auf.
  if(ok && needPush && !opt.keepalive) setTimeout(()=>{ if(needPush) doSync(true); },800);
}
function setSync(s){ const p=document.getElementById('syncpill'),t=document.getElementById('synctext'); if(!p) return;
  p.className='syncpill'+(s==='busy'?' busy':s==='err'?' err':s==='off'?' off':'');
  t.textContent=s==='busy'?'sync…':s==='err'?'Sync?':s==='off'?'nur lokal':'aktuell'; }
let pushTimer=null;
function touchAndSave(){ persistLocal(); clearTimeout(pushTimer); pushTimer=setTimeout(()=>doSync(true),1200); }
const stamp=o=>{ o.updatedAt=now(); o.by=config.person||''; };

/* ---- Push („Anstupsen") ----------------------------------------------------
   Zustellung läuft NICHT über den Cloudflare-Worker: Der verschlüsselt und
   übergibt die Nachricht nur an Apple bzw. Google. Geweckt wird danach der
   Service-Worker auf dem Zielgerät – vom Betriebssystem, über dieselbe
   Verbindung, die auch normale App-Meldungen zustellt. Die App des Empfängers
   muss dafür weder offen noch im Hintergrund sein.

   Auf dem iPhone gibt es Push nur in der zum Home-Bildschirm hinzugefügten App
   (iOS 16.4+), nie in einem Safari-Tab. Deshalb überall abgesichert. */
const PUSH_OK=()=> 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window
  && !!VAPID_PUBLIC && !VAPID_PUBLIC.startsWith('DEIN-');
function b64urlToBytes(s){ const b64=s.replace(/-/g,'+').replace(/_/g,'/');
  const bin=atob(b64+'='.repeat((4-b64.length%4)%4)); return Uint8Array.from(bin,c=>c.charCodeAt(0)); }

/* Feste Geräte-ID, nur lokal: Sonst legte jeder Start einen neuen Eintrag an. */
let myDeviceId=null;
async function deviceId(){ if(myDeviceId) return myDeviceId;
  let id=await lget(DEV_KEY);
  if(!id){ id=uid()+uid(); await lset(DEV_KEY,id); }
  return (myDeviceId=id); }
const otherDevices=()=>Object.values(state.devices||{}).filter(d=>!d.deleted&&d.endpoint&&d.id!==myDeviceId);

async function storeSub(sub){ const id=await deviceId(), j=sub.toJSON();
  state.devices[id]={ id, name:config.person||'', endpoint:j.endpoint,
    p256dh:j.keys.p256dh, auth:j.keys.auth, updatedAt:now(), deleted:false };
  touchAndSave(); }

/* Muss direkt aus dem Tap laufen – die Erlaubnis verlangt eine Nutzer-Geste. */
async function subscribePush(){
  if(!PUSH_OK()) throw new Error('unsupported');
  const perm=await Notification.requestPermission();
  if(perm!=='granted') throw new Error(perm==='denied'?'denied':'dismissed');
  const reg=await navigator.serviceWorker.ready;
  const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64urlToBytes(VAPID_PUBLIC)});
  await storeSub(sub); }

/* Bei jedem Start abgleichen. Push-Dienste tauschen den Endpoint stillschweigend
   aus; `pushsubscriptionchange` feuert auf WebKit unzuverlässig. Dieser Abgleich
   ist der verlässliche Weg, das Abo am Leben zu halten. */
async function syncPushSub(){
  if(!PUSH_OK()||Notification.permission!=='granted') return;
  try{
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64urlToBytes(VAPID_PUBLIC)});
    const id=await deviceId(), cur=state.devices[id];
    if(!cur||cur.deleted||cur.endpoint!==sub.endpoint||cur.name!==(config.person||'')) await storeSub(sub);
  }catch(e){ console.warn('Push-Abo:',e); } }

function pushHint(){
  if(!VAPID_PUBLIC||VAPID_PUBLIC.startsWith('DEIN-')) return 'VAPID_PUBLIC ist noch nicht eingetragen.';
  if(!('Notification' in window)||!('PushManager' in window))
    return 'Auf dem iPhone geht das nur in der App vom Home-Bildschirm: teilen → „Zum Home-Bildschirm".';
  return 'Benachrichtigungen sind hier nicht verfügbar.'; }
function pushLabel(){
  if(!PUSH_OK()) return 'Benachrichtigungen · hier nicht möglich';
  if(Notification.permission==='denied') return 'Benachrichtigungen · blockiert';
  const mine=myDeviceId&&state.devices[myDeviceId];
  if(Notification.permission==='granted'&&mine&&!mine.deleted) return 'Benachrichtigungen · aktiv';
  return 'Benachrichtigungen einschalten'; }

/* Schickt jedem anderen registrierten Gerät eine Meldung. Kein Empfänger-Menü:
   Bei zwei Leuten ist „alle außer mir" genau die richtige Auswahl. */
async function nudge(listId){
  const L=state.lists[listId]; if(!L) return;
  const targets=otherDevices();
  if(!targets.length){ toast('Kein anderes Gerät registriert. Dort in den Einstellungen die Benachrichtigungen einschalten.',true); return; }
  let sent=0,gone=0;
  await Promise.all(targets.map(async d=>{
    try{
      const res=await fetch(PROXY_BASE.replace(/\/$/,'')+'/push',{ method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ subscription:{endpoint:d.endpoint,keys:{p256dh:d.p256dh,auth:d.auth}},
          listId:L.id, listName:L.name, fromName:config.person||'jemand' }) });
      const out=await res.json().catch(()=>({}));
      if(res.ok&&out.status>=200&&out.status<300){ sent++; return; }
      // 404/410 = abbestellt oder abgelaufen. Eintrag beerdigen, sonst stolpert
      // jeder weitere Anstupser über dasselbe tote Abo.
      if(out.status===404||out.status===410){ d.deleted=true; d.updatedAt=now(); gone++; }
      else console.warn('Push abgelehnt:',out);
    }catch(e){ console.warn('Push:',e); } }));
  if(gone) touchAndSave();
  if(sent) toast(sent===1?'Angestupst.':`An ${sent} Geräte gesendet.`);
  else toast(gone?'Abo abgelaufen — auf dem anderen Gerät neu einschalten.':'Konnte nicht senden.',true); }

/* Der Absender bekommt seine eigene Meldung nie zu sehen. Ohne diese Rückmeldung
   sähe der Knopf aus, als täte er nichts. */
let toastTimer=null;
function toast(msg,err){ const old=document.querySelector('.toast'); if(old) old.remove();
  const el=document.createElement('div'); el.className='toast'+(err?' err':''); el.textContent=msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.remove(), err?4500:1900); }

/* ---- Mutationen ----------------------------------------------------------- */
function addGroup(name){ const id=uid(),t=now();
  state.groups[id]={id,name:name||'Neue Gruppe',order:Object.keys(state.groups).length,createdAt:t,updatedAt:t,by:config.person,deleted:false}; return id; }
function addList(groupId,name,opt={}){ const id=uid(),t=now();
  state.lists[id]={id,name:name||'Neue Liste',groupId,order:now(),archived:false,archivedAt:0,template:!!opt.template,
    createdAt:t,updatedAt:t,by:config.person,deleted:false,items:{}}; return id; }
function addItem(listId,text,qty,link){ const L=state.lists[listId]; if(!L) return;
  const norm=text.trim().toLowerCase();
  const dup=Object.values(L.items).find(i=>!i.deleted&&!i.done&&i.text.trim().toLowerCase()===norm);
  // Eine mitgegebene Notiz füllt nur eine leere – die vorhandene ist älter und
  // stand nicht zur Debatte, als der Nutzer den Eintrag ein zweites Mal tippte.
  if(dup){ dup.qty=combineQty(dup.qty,qty||'1x'); if(link&&!dup.link) dup.link=link.trim(); stamp(dup); stamp(L); return; }
  const id=uid(),t=now();
  L.items[id]={id,text:text.trim(),qty:(qty||'').trim(),link:(link||'').trim(),done:false,order:t,createdAt:t,updatedAt:t,by:config.person,deleted:false};
  stamp(L); }
/* Mehrere Zeilen auf einmal – dieselbe Funktion für Tippen, Einfügen und Import. */
function addItemsFromText(listId,raw,link){ let n=0;
  String(raw||'').split('\n').map(s=>s.trim()).filter(Boolean).forEach(line=>{
    const p=parseLine(line); addItem(listId,p.text,p.qty,link); n++; });
  return n; }
const rename=(kind,id,name)=>{ const o=kind==='group'?state.groups[id]:state.lists[id]; if(o&&name.trim()){ o.name=name.trim(); stamp(o);} };
function delItem(listId,itemId){ const it=state.lists[listId]?.items[itemId]; if(it){ it.deleted=true; stamp(it); stamp(state.lists[listId]); } }
function clearDone(listId){ const L=state.lists[listId]; if(!L) return;
  for(const it of Object.values(L.items)) if(it.done&&!it.deleted){ it.deleted=true; stamp(it);} stamp(L); }
function archiveList(listId,val=true){ const L=state.lists[listId]; if(!L) return; L.archived=val; L.archivedAt=val?now():0; stamp(L); }
function deleteList(listId){ const L=state.lists[listId]; if(L){ L.deleted=true; stamp(L);} }
function rescueLeftovers(listId){ const L=state.lists[listId]; if(!L) return null;
  // 1) Datierten Schnappschuss der aktuellen Liste (kompletter Inhalt) ins Archiv
  const datum=new Date().toLocaleDateString('de-DE');
  const snapId=addList(L.groupId, L.name+' – '+datum);
  const snap=state.lists[snapId];
  for(const it of Object.values(L.items)) if(!it.deleted){ const t=now(); const nid=uid();
    snap.items[nid]={...it,id:nid,createdAt:t,updatedAt:t,deleted:false}; }
  archiveList(snapId,true);
  // 2) Lebende Liste behält Namen + offene Einträge; Erledigte werden gelöscht
  for(const it of Object.values(L.items)) if(it.done&&!it.deleted){ it.deleted=true; stamp(it); }
  stamp(L);
  return listId; }
function saveAsTemplate(listId){ const L=state.lists[listId]; if(!L) return;
  const nid=addList(L.groupId,L.name,{template:true});
  for(const it of Object.values(L.items)) if(!it.deleted) addItem(nid,it.text,it.qty,it.link); }
function listFromTemplate(tplId){ const T=state.lists[tplId]; if(!T) return null;
  const nid=addList(T.groupId,T.name);
  // Frische Einträge sind ohnehin unerledigt – die Vorlage gibt nur Text, Menge, Notiz.
  for(const it of Object.values(T.items)) if(!it.deleted) addItem(nid,it.text,it.qty,it.link);
  return nid; }
function deleteTemplate(id){ deleteList(id); }

/* Nicht im Verlauf: das Notizfeld ist kein Overlay, sondern eine Aufklappzeile. */
let addNoteOpen=false;
/* Läuft gerade etwas, das nicht halb passieren darf. Bewusst kein
   History-Eintrag: die Zurück-Geste soll das nicht abbrechen können. */
let busyMsg=null, working=false;

/* ---- Navigation über die History-API --------------------------------------
   Jede Ansicht und jedes Overlay bekommt einen History-Eintrag. Damit macht
   der Android-Zurück-Knopf und die iOS-Wischgeste das Erwartete, statt die
   App zu schließen. `depth` zählt unsere eigenen Einträge mit, damit wir nie
   aus der App heraus zurückspringen. */
const UI=()=>({view,editing,expanded,sheetFor,tplSheet,settingsOpen,confirmAsk,importFor});
function applyUI(s){ if(!s) return;
  view=s.view||{name:'home'}; editing=s.editing||null; expanded=s.expanded||null;
  sheetFor=s.sheetFor||null; tplSheet=s.tplSheet||null; settingsOpen=!!s.settingsOpen;
  confirmAsk=s.confirmAsk||null; importFor=s.importFor||null; }
const anyOverlay=()=>!!(sheetFor||tplSheet||settingsOpen||confirmAsk||expanded||editing||importFor);
const curDepth=()=>(history.state&&typeof history.state.depth==='number')?history.state.depth:0;
let suppressPop=null;   // {push} – ein von uns selbst ausgelöstes history.back()

function nav(mutate,{replace=false}={}){ if(mutate) mutate();
  const s={...UI(),depth:replace?curDepth():curDepth()+1};
  if(replace) history.replaceState(s,''); else history.pushState(s,'');
  render(); }
/* Overlay öffnen: neuer Eintrag – außer es ist schon eins offen (Wechsel). */
function openOverlay(mutate){ const r=anyOverlay(); nav(mutate,{replace:r}); }
/* Overlay schließen: den Eintrag per back() entfernen, dann mutieren. popstate
   feuert danach und übernimmt den bereits mutierten Zustand (suppressPop). */
function closeOverlay(mutate,{push=false}={}){ if(suppressPop) return;   // Doppel-Tap: nur einmal zurück
  // Nie unter den eigenen untersten Eintrag zurück: dort landet man nicht auf
  // der Startseite, sondern auf der Seite, die vor der App im Tab stand.
  if(curDepth()<=0){ nav(mutate,{replace:true}); return; }
  suppressPop={push}; history.back(); if(mutate) mutate(); }
function goHome(){ if(suppressPop) return;              // eine Rückwärts-Navigation läuft schon
  if(curDepth()>0) history.back();                     // depth 0 = unterster eigener Eintrag:
  else nav(()=>{ view={name:'home'}; expanded=editing=sheetFor=null; },{replace:true}); }

window.addEventListener('popstate',e=>{
  if(suppressPop){ const {push}=suppressPop; suppressPop=null; nav(null,{replace:!push}); return; }
  applyUI(e.state||{view:{name:'home'}}); render(); });

/* ---- Selektoren ----------------------------------------------------------- */
const liveLists=()=>Object.values(state.lists).filter(l=>!l.deleted&&!l.archived&&!l.template);
const templates=()=>Object.values(state.lists).filter(l=>!l.deleted&&l.template).sort((a,b)=>a.order-b.order);
const archivedLists=()=>Object.values(state.lists).filter(l=>!l.deleted&&l.archived&&!l.template).sort((a,b)=>b.archivedAt-a.archivedAt);
const liveGroups=()=>Object.values(state.groups).filter(g=>!g.deleted).sort((a,b)=>a.order-b.order);
const listsOf=gid=>liveLists().filter(l=>l.groupId===gid).sort((a,b)=>a.order-b.order);
const items=L=>Object.values(L.items).filter(i=>!i.deleted).sort((a,b)=>(a.done-b.done)||(a.order-b.order));
const openCount=L=>items(L).filter(i=>!i.done).length;
const fmtBy=o=>o&&o.by?`· zuletzt: ${esc(o.by)}`:'';

/* ---- Render --------------------------------------------------------------- */
const main=document.getElementById('main'), here=document.getElementById('here'), hdr=document.getElementById('hdr');
function render(){
  // Abgemeldet gibt es genau einen Bildschirm. Ohne diese Regel führte die
  // Zurück-Geste nach dem Abmelden zurück in eine leere App, die noch aussah
  // wie die Sitzung davor – der Verlauf kennt die alten Ansichten ja weiter.
  if(!config.configured) view={name:'setup'};
  if(view.name==='setup'){ hdr.classList.add('hidden'); renderSetup(); }
  else{
    hdr.classList.remove('hidden');
    if(view.name==='list' && (!state.lists[view.id]||state.lists[view.id].deleted)) view={name:'home'};
    if(view.name==='home') renderHome();
    else if(view.name==='list') renderList(state.lists[view.id]);
    else if(view.name==='archive') renderArchive();
  }
  // Auch für das Setup: Sonst bliebe ein offenes Sheet oder die Sperre vom
  // Abmelden über dem Einrichtungsbildschirm kleben und nähme jeden Tipp weg.
  renderSheet(); renderTplSheet(); renderSettings(); renderConfirm(); renderImport(); renderItemEdit(); renderBusy();
}
function renderBusy(){ const old=document.querySelector('.busy'); if(old) old.remove();
  if(!busyMsg) return;
  const el=document.createElement('div'); el.className='busy';
  el.innerHTML=`<div class="card"><span class="spin"></span>${esc(busyMsg)}</div>`;
  document.body.appendChild(el); }
function renderSetup(prefill){
  const c=prefill||config;
  main.innerHTML=`<div class="setup">
    <div class="logo">Listen</div>
    <div class="lede">Einmal einrichten — danach merkt sich die App alles.</div>

/* ---- Drag-Reihenfolge -------------------------------------------------------
   Ein Mechanismus für zwei Fälle: Einträge innerhalb einer Liste (genau ein
   Container) und Listen auf der Startseite (jede Gruppe ein Container – dort
   ist der Wechsel zwischen Containern das Verschieben in eine andere Gruppe). */
const EDGE=80, EDGE_SPEED=12;   // Auto-Scroll nahe am Rand des Viewports
const DRAG_KIND={
  item:{ sel:'li.item',   containers:()=>[...main.querySelectorAll('ul.items')] },
  list:{ sel:'.listcard', containers:()=>[...main.querySelectorAll('.lists[data-group]')] },
};
let drag=null, scrollDir=0, scrollRaf=0;
function bindDrag(){ main.querySelectorAll('.handle[data-drag]').forEach(h=>h.addEventListener('pointerdown',onDragStart)); }
function autoScroll(){ if(!drag||!scrollDir){ scrollRaf=0; return; }
  window.scrollBy(0,scrollDir*EDGE_SPEED); scrollRaf=requestAnimationFrame(autoScroll); }
function stopAutoScroll(){ scrollDir=0; if(scrollRaf) cancelAnimationFrame(scrollRaf); scrollRaf=0; }
function onDragStart(e){ e.preventDefault();
  const kind=e.currentTarget.dataset.drag, cfg=DRAG_KIND[kind]; if(!cfg) return;
  const el=e.currentTarget.closest(cfg.sel); if(!el||!el.parentNode) return;
  const containers=cfg.containers(); if(!containers.length) return;
  drag={kind,el,sel:cfg.sel,containers};
  el.classList.add('dragging'); document.body.classList.add('dragging');
  try{e.currentTarget.setPointerCapture(e.pointerId);}catch(_){}
  window.addEventListener('pointermove',onDragMove);
  window.addEventListener('pointerup',onDragEnd,{once:true});
  window.addEventListener('pointercancel',onDragEnd,{once:true}); }
function onDragMove(e){ if(!drag) return; const {el,sel}=drag;
  // Container unter dem Finger; außerhalb aller bleibt es der aktuelle.
  const box=drag.containers.find(c=>{ const r=c.getBoundingClientRect();
    return e.clientY>=r.top-8 && e.clientY<=r.bottom+8; }) || el.parentNode;
  const others=[...box.children].filter(x=>x!==el&&x.matches(sel)); let ref=null;
  for(const s of others){ const r=s.getBoundingClientRect(); if(e.clientY<r.top+r.height/2){ ref=s; break; } }
  if(ref) box.insertBefore(el,ref); else box.appendChild(el);
  const dir = e.clientY<EDGE ? -1 : e.clientY>window.innerHeight-EDGE ? 1 : 0;
  if(dir!==scrollDir){ scrollDir=dir; if(dir&&!scrollRaf) scrollRaf=requestAnimationFrame(autoScroll); } }
function onDragEnd(){
  window.removeEventListener('pointermove',onDragMove);
  window.removeEventListener('pointerup',onDragEnd);
  window.removeEventListener('pointercancel',onDragEnd);
  stopAutoScroll();
  if(!drag) return; const d=drag; drag=null;
  d.el.classList.remove('dragging'); document.body.classList.remove('dragging');
  if(d.kind==='item') commitItemOrder(d); else commitListOrder(d);
  touchAndSave(); render(); }
// stamp() pro verschobenem Element ist Pflicht: ohne frisches updatedAt gewinnt
// beim nächsten Merge die alte Remote-Reihenfolge zurück.
function commitItemOrder(d){ const L=state.lists[view.id]; if(!L) return;
  [...d.el.parentNode.querySelectorAll('li.item')].forEach((x,i)=>{ const it=L.items[x.dataset.id];
    if(it && it.order!==i+1){ it.order=i+1; stamp(it); } });
  stamp(L); }
function commitListOrder(d){
  for(const box of d.containers){ const gid=box.dataset.group;
    [...box.querySelectorAll('.listcard')].forEach((x,i)=>{ const l=state.lists[x.dataset.id]; if(!l) return;
      if(l.order!==i+1||l.groupId!==gid){ l.order=i+1; l.groupId=gid; stamp(l); } }); } }

/* ---- Langdruck auf eine Listenkarte ----------------------------------------
   Ziehen läuft über den Griff, der Rest der Karte gehört dem Langdruck. Nach
   dem Auslösen kommt trotzdem noch ein `click` – der würde die Liste öffnen,
   deshalb der Merker. */
const PRESS_MS=500, PRESS_SLOP=8;
let pressTimer=null, pressStart=null;
/* Beim Loslassen kommt noch ein Klick auf die Karte, der die Liste öffnen würde.
   Genau der wird geschluckt – nur er: ein Klick woanders (etwa auf „Archivieren"
   im gerade geöffneten Dialog) muss durch. Der Fänger räumt sich selbst weg,
   falls gar kein Klick mehr kommt, weil der Finger von der Karte gezogen wurde.
   Gesucht wird über die Listen-ID, nicht über das Element: das Öffnen des
   Dialogs baut die Startseite neu auf, die gedrückte Karte ist dann eine andere. */
function swallowNextClick(id){
  const off=()=>{ clearTimeout(t); window.removeEventListener('click',kill,true); };
  const kill=e=>{ const c=e.target.closest?e.target.closest('[data-press="list"]'):null;
    if(!c||c.dataset.id!==id) return; e.preventDefault(); e.stopPropagation(); off(); };
  const t=setTimeout(off,700);
  window.addEventListener('click',kill,true); }
function bindLongPress(){ main.querySelectorAll('[data-press="list"]').forEach(el=>{
    el.addEventListener('pointerdown',onPressStart);
    el.addEventListener('pointermove',onPressMove);
    el.addEventListener('pointerup',cancelPress);
    el.addEventListener('pointercancel',cancelPress);
    el.addEventListener('contextmenu',e=>e.preventDefault()); }); }
function onPressStart(e){ if(e.target.closest('.handle')) return;   // Griff = ziehen
  cancelPress(); const card=e.currentTarget, id=card.dataset.id;
  pressStart={x:e.clientX,y:e.clientY};
  pressTimer=setTimeout(()=>{ pressTimer=null; swallowNextClick(id);
    if(navigator.vibrate) try{ navigator.vibrate(12); }catch(_){}
    const L=state.lists[id]; if(!L) return;
    openOverlay(()=>{ confirmAsk={kind:'listDel',id,text:`Liste „${esc(L.name)}" löschen?`,
      yes:'Ja', no:'Nein', extra:[{act:'archive',label:'Archivieren',icon:ICON.archive}]}; });
  },PRESS_MS); }
function onPressMove(e){ if(!pressStart) return;
  if(Math.abs(e.clientX-pressStart.x)>PRESS_SLOP||Math.abs(e.clientY-pressStart.y)>PRESS_SLOP) cancelPress(); }
function cancelPress(){ clearTimeout(pressTimer); pressTimer=null; pressStart=null; }
window.addEventListener('scroll',cancelPress,{passive:true});

/* ---- Events --------------------------------------------------------------- */
function bindCommon(){ main.querySelectorAll('[data-act]').forEach(el=>el.addEventListener('click',onTap)); }
function bindForms(){ main.querySelectorAll('form[data-commit]').forEach(f=>{ f.addEventListener('submit',onSubmit);
  const i=f.querySelector('input[autofocus]'); if(i){ i.focus(); i.select&&i.select(); } }); }
function renderConfirm(){ const old=document.querySelector('.sheet#confirmsheet'); if(old) old.remove();
  if(!confirmAsk) return;
  const el=document.createElement('div'); el.className='sheet'; el.id='confirmsheet';
  // `extra` sind Zwischenwege zwischen Ja und Nein – etwa „archivieren statt löschen".
  const extra=(confirmAsk.extra||[]).map(x=>`<button class="row" data-extra="${x.act}">${x.icon||''} ${esc(x.label)}</button>`).join('');
  el.innerHTML=`<div class="sheet-inner"><h3>${confirmAsk.text}</h3>
    <button class="row danger" data-yes="1">${confirmAsk.icon||ICON.trash} ${esc(confirmAsk.yes||'Löschen')}</button>
    ${extra}
    <button class="row" data-yes="0">${esc(confirmAsk.no||'Abbrechen')}</button></div>`;
  el.addEventListener('click',e=>{ if(e.target===el) closeOverlay(()=>{ confirmAsk=null; }); });
  document.body.appendChild(el);
  el.querySelectorAll('[data-yes],[data-extra]').forEach(b=>b.addEventListener('click',onConfirm)); }
function onConfirm(e){ const d=e.currentTarget.dataset, yes=d.yes==='1', a=confirmAsk;
  // Beide räumen den Dialog selbst weg und fassen den Verlauf erst ganz am Ende
  // an – ein closeOverlay() hier liefe gegen ihre eigene Navigation.
  if(yes&&a&&a.kind==='hardReload'){ hardReloadFromGmx(); return; }
  if(yes&&a&&a.kind==='reset'){ logout(); return; }
  closeOverlay(()=>{ confirmAsk=null; if(!a) return;
    if(d.extra==='archive'){ archiveList(a.id,true); touchAndSave(); return; }
    if(yes){ if(a.kind==='archDel'||a.kind==='listDel') deleteList(a.id);
      else if(a.kind==='archClear'){ for(const l of archivedLists()) deleteList(l.id); }
      touchAndSave(); } }); }
async function hardReloadFromGmx(){ if(working) return; working=true;
  confirmAsk=null; settingsOpen=false; busyMsg='Lade von GMX…'; setSync('busy'); render();
  // Erst lesen, dann verwerfen: schlägt der Lesezugriff fehl, bleibt der
  // lokale Stand erhalten statt ersatzlos gelöscht zu sein.
  try{ const remote=await Remote.read(); state=normState(remote); await persistLocal(); setSync('ok'); }
  catch(e){ console.warn(e); setSync(config.mode==='gmx'?'err':(HAS_LS?'ok':'off')); }
  await syncPushSub();   // eigenes Abo wieder eintragen, falls es remote fehlte
  busyMsg=null; working=false;
  nav(()=>{ view={name:'home'}; expanded=editing=sheetFor=tplSheet=importFor=null; },{replace:true}); }
function onTap(e){ const el=e.currentTarget,act=el.dataset.act,id=el.dataset.id;
  if(act==='home') goHome();
  else if(act==='archive-view') nav(()=>{ view={name:'archive'}; });
  else if(act==='open') nav(()=>{ view={name:'list',id}; expanded=editing=null; });
  else if(act==='tpl') openOverlay(()=>{ tplSheet=id; });
  else if(act==='new-group') openOverlay(()=>{ editing={kind:'newgroup'}; });
  else if(act==='new-list') openOverlay(()=>{ editing={kind:'newlist',id}; });
  else if(act==='import') openOverlay(()=>{ importFor=id; });
  else if(act==='edit-group') openOverlay(()=>{ editing={kind:'group',id}; });
  else if(act==='edit-list') openOverlay(()=>{ editing={kind:'list',id}; });
  else if(act==='expand'){ if(expanded===id) closeOverlay(()=>{ expanded=null; }); else openOverlay(()=>{ expanded=id; }); }
  else if(act==='toggle-note'){ addNoteOpen=!addNoteOpen; render();
    const n=main.querySelector('.additem input.note'); if(n) n.focus(); }
  else if(act==='sheet') openOverlay(()=>{ sheetFor=id; });
  // Kein render() – der Knopf bleibt gesperrt, bis der Versand durch ist.
  else if(act==='nudge'){ el.disabled=true; nudge(id).finally(()=>{ el.disabled=false; }); }
  else if(act==='toggle'){ const L=state.lists[el.dataset.list],it=L&&L.items[id]; if(!it) return;
    it.done=!it.done; stamp(it); stamp(L); touchAndSave(); render(); }
  else if(act==='delitem') closeOverlay(()=>{ delItem(el.dataset.list,id); expanded=null; touchAndSave(); });
  else if(act==='restore'){ archiveList(id,false); touchAndSave(); render(); }
  else if(act==='arch-del'){ const L=state.lists[id];
    openOverlay(()=>{ confirmAsk={kind:'archDel',id,text:`„${L?esc(L.name):''}" endgültig löschen?`}; }); }
  else if(act==='arch-clear') openOverlay(()=>{ confirmAsk={kind:'archClear',text:'Gesamtes Archiv löschen? Das lässt sich nicht rückgängig machen.'}; }); }
function onSheet(e){ const act=e.currentTarget.dataset.act,id=e.currentTarget.dataset.id;
  if(act==='rescue') closeOverlay(()=>{ sheetFor=null; const n=rescueLeftovers(id); touchAndSave(); view={name:'list',id:n}; });
  else if(act==='clear-done') closeOverlay(()=>{ sheetFor=null; clearDone(id); touchAndSave(); });
  else if(act==='tpl-save') closeOverlay(()=>{ sheetFor=null; saveAsTemplate(id); touchAndSave(); });
  else if(act==='done-list') closeOverlay(()=>{ sheetFor=null; archiveList(id,true); touchAndSave(); view={name:'home'}; });
  else if(act==='del-list') closeOverlay(()=>{ sheetFor=null; deleteList(id); touchAndSave(); view={name:'home'}; }); }
function onTplSheet(e){ const act=e.currentTarget.dataset.act,id=e.currentTarget.dataset.id;
  if(act==='tpl-use') closeOverlay(()=>{ tplSheet=null; const n=listFromTemplate(id); touchAndSave(); view={name:'list',id:n}; },{push:true});
  else if(act==='tpl-open') closeOverlay(()=>{ tplSheet=null; view={name:'list',id}; },{push:true});
  else if(act==='tpl-del') closeOverlay(()=>{ tplSheet=null; deleteTemplate(id); touchAndSave(); }); }
async function onSettings(e){ const act=e.currentTarget.dataset.act;
  if(act==='set-push'){
    if(!PUSH_OK()){ toast(pushHint(),true); return; }          // Sheet offen lassen
    closeOverlay(()=>{ settingsOpen=false; });
    // Kein await vor requestPermission(): sonst ist die Nutzer-Geste verbraucht.
    try{ await subscribePush(); toast('Benachrichtigungen aktiv.'); }
    catch(err){ const m=String(err&&err.message||err);
      toast(m==='denied' ? 'Blockiert — in den Systemeinstellungen für „Listen" wieder erlauben.'
        : m==='dismissed' ? 'Abgebrochen.' : 'Fehlgeschlagen: '+m, true); } }
  else if(act==='set-conn') closeOverlay(()=>{ settingsOpen=false; view={name:'setup'}; },{push:true});
  else if(act==='set-sync'){ closeOverlay(()=>{ settingsOpen=false; }); doSync(true); }
  else if(act==='set-reload') closeOverlay(()=>{ settingsOpen=false;
    confirmAsk={kind:'hardReload',text:'Diese lokale Version verwerfen und alles frisch aus GMX laden?',yes:'Neu laden',icon:ICON.restore}; },{push:true});
  else if(act==='set-reset') closeOverlay(()=>{ settingsOpen=false;
    confirmAsk={kind:'reset',text:'Abmelden und alle Daten von diesem Gerät löschen?',
      yes:'Abmelden',no:'Abbrechen'}; },{push:true}); }

/* Abmelden muss wirklich abmelden: Ohne das Leeren der Ablagen liest boot() die
   alten Listen wieder ein – der Demo-Modus sah danach aus wie das GMX-Konto. */
async function logout(){ if(working) return; working=true;
  // Dialog sofort weg und Oberfläche sperren: Das Löschen darf nicht auf halbem
  // Weg von einem zweiten Tipp unterbrochen werden – sonst bleiben die Listen
  // liegen und der Demo-Modus zeigt sie hinterher wieder.
  confirmAsk=null; settingsOpen=false; busyMsg='Melde ab…'; setSync('busy'); render();
  // Erst das eigene Push-Abo beerdigen und den Grabstein hochladen, sonst stupst
  // das andere Handy weiter ein Abo an, das es hier nicht mehr gibt.
  // Beides mit Frist: Ohne Netz hängt ein fetch sonst ewig, und
  // serviceWorker.ready wird nie fertig, wenn keiner registriert ist. Abmelden
  // muss auch dann durchlaufen — notfalls ohne den Grabstein.
  try{
    const id=myDeviceId, d=id&&state.devices[id];
    if(d&&!d.deleted){ d.deleted=true; stamp(d); await withTimeout(doSync(true),6000); }
  }catch(e){ console.warn('Abmelden (Sync):',e); }
  try{ const reg=await withTimeout(navigator.serviceWorker.ready,3000);
    const sub=await reg.pushManager.getSubscription();
    if(sub) await sub.unsubscribe(); }catch(e){ console.warn('Abmelden (Push):',e); }
  // Ab hier nichts mehr, was scheitern kann, bevor gelöscht ist.
  await lremove(LOCAL_KEY); await lremove(SHARED_KEY); await lremove(CFG_KEY);
  state=emptyState();
  config={configured:false,mode:'demo',gmxUser:'',gmxPass:'',path:'/listen.json',person:''};
  setSync(HAS_LS?'ok':'off');
  busyMsg=null; working=false;
  nav(()=>{ view={name:'setup'}; expanded=editing=sheetFor=tplSheet=importFor=null; },{replace:true});
  toast('Abgemeldet. Dieses Gerät ist leer.'); }
function onSubmit(e){ e.preventDefault(); const f=e.currentTarget,kind=f.dataset.commit,id=f.dataset.id;
  if(kind==='additem'){ const inp=f.querySelector('#itemInput'); const raw=inp.value.trim(); if(!raw) return;
    const note=f.note?f.note.value.trim():'';
    addItemsFromText(id,raw,note);
    inp.value=''; if(f.note) f.note.value=''; addNoteOpen=false; focusAdd=true; touchAndSave(); render(); return; }
  if(kind==='itemedit'){ closeOverlay(()=>{ const L=state.lists[f.dataset.list],it=L&&L.items[f.dataset.id];
    // Die Menge steckt im Text („3x Milch") und wird hier wieder abgetrennt –
    // dieselbe Erkennung wie beim Anlegen, damit beides zusammenpasst.
    if(it){ const p=parseLine(f.text.value); if(p.text){ it.text=p.text; it.qty=p.qty; }
      it.link=f.note.value.trim(); stamp(it); stamp(L); }
    expanded=null; touchAndSave(); }); return; }
  if(kind==='import'){ const name=f.listname.value.trim(), raw=f.text.value;
    if(!raw.trim()) return;
    const lines=raw.split('\n').map(s=>s.trim()).filter(Boolean);
    const title=name||lines.shift()||'Importierte Liste';
    closeOverlay(()=>{ importFor=null; const n=addList(id,title);
      addItemsFromText(n,lines.join('\n')); touchAndSave(); view={name:'list',id:n}; },{push:true});
    return; }
  const val=f.querySelector('input').value.trim();
  if(kind==='newgroup') closeOverlay(()=>{ if(val) addGroup(val); editing=null; touchAndSave(); });
  else if(kind==='newlist'){ if(val) closeOverlay(()=>{ const n=addList(id,val); editing=null; touchAndSave(); view={name:'list',id:n}; },{push:true});
    else closeOverlay(()=>{ editing=null; }); }
  else if(kind==='group') closeOverlay(()=>{ rename('group',id,val); editing=null; touchAndSave(); });
  else if(kind==='list') closeOverlay(()=>{ rename('list',id,val); editing=null; touchAndSave(); }); }

document.getElementById('syncpill').addEventListener('click',()=>doSync(true));
document.getElementById('gear').addEventListener('click',()=>openOverlay(()=>{ settingsOpen=true; }));
document.addEventListener('visibilitychange',()=>{ if(view.name==='setup') return;
  if(document.visibilityState==='hidden') doSync(true,{keepalive:true}); else doSync(false); });
window.addEventListener('pagehide',()=>{ if(view.name!=='setup') doSync(true,{keepalive:true}); });
// needPush statt false: ein liegengebliebener Push wird hier nachgeholt.
setInterval(()=>{ if(document.visibilityState==='visible'&&view.name!=='setup') doSync(needPush); },SYNC_MS);

/* ---- Start ---------------------------------------------------------------- */
function seedIfEmpty(){ if(Object.keys(state.groups).length) return; const t=now();
  state.groups['g_einkauf']={id:'g_einkauf',name:'Einkauf',order:0,createdAt:t,updatedAt:t,by:'',deleted:false};
  state.groups['g_haushalt']={id:'g_haushalt',name:'Haushalt',order:1,createdAt:t,updatedAt:t,by:'',deleted:false};
  state.lists['l_super']={id:'l_super',name:'Supermarkt',groupId:'g_einkauf',order:1,archived:false,archivedAt:0,template:false,
    createdAt:t,updatedAt:t,by:'',deleted:false,items:{
      i1:{id:'i1',text:'Milch',qty:'2x',link:'',done:false,order:1,createdAt:t,updatedAt:t,by:'',deleted:false},
      i2:{id:'i2',text:'Brot',qty:'',link:'',done:false,order:2,createdAt:t,updatedAt:t,by:'',deleted:false},
      i3:{id:'i3',text:'Kaffee',qty:'500g',link:'',done:true,order:3,createdAt:t,updatedAt:t,by:'',deleted:false}}}; }
async function boot(){ if(config.mode!=='gmx'&&!HAS_LS) setSync('off');
  const local=await lget(LOCAL_KEY); if(local) state=normState(local);
  await doSync(false);
  // Nur säen, wenn wir sicher wissen, dass die Gegenseite leer ist. Sonst
  // landen die Demo-Einträge nach einem Offline-Start in der echten GMX-Datei.
  if(config.mode!=='gmx' || lastReadOk) seedIfEmpty();
  await persistLocal(); await syncPushSub(); nav(null,{replace:true}); }

/* Tipp auf die Meldung, App war zu: der Service-Worker startet uns mit #list=… */
function viewFromHash(){ const m=(location.hash||'').match(/^#list=([A-Za-z0-9_-]+)$/); if(!m) return null;
  history.replaceState(null,'',location.pathname+location.search);   // Hash nicht kleben lassen
  return {name:'list',id:m[1]}; }

async function start(){ const cfg=await lget(CFG_KEY); if(cfg) config={...config,...cfg};
  await deviceId();
  if(!config.configured) nav(()=>{ view={name:'setup'}; },{replace:true});
  else { view=viewFromHash()||{name:'home'}; await boot(); } }

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  // Tipp auf die Meldung, App lief noch: der Service-Worker fokussiert uns und
  // schickt die Listen-ID hierher, statt uns über den Hash neu zu starten.
  navigator.serviceWorker.addEventListener('message',e=>{ const d=e.data||{};
    if(d.type==='open-list'&&d.id&&state.lists[d.id]&&!state.lists[d.id].deleted)
      nav(()=>{ view={name:'list',id:d.id}; expanded=editing=sheetFor=null; });
    else if(d.type==='resub') syncPushSub(); });
}
start();
</script>
